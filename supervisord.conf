[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:x-ui]
command=/usr/bin/x-ui
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:cloudflared]
command=/bin/sh -c '/usr/local/bin/cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN"'
autostart=true
autorestart=true
priority=200
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
