services:
  xui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xui
    restart: unless-stopped
    volumes:
      - xui-data:/data
    environment:
      # Cloudflare Tunnel token
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      # Komari Agent 官方变量
      AGENT_ENDPOINT: ${AGENT_ENDPOINT:?AGENT_ENDPOINT is required}
      AGENT_AUTO_DISCOVERY_KEY: ${AGENT_AUTO_DISCOVERY_KEY:?AGENT_AUTO_DISCOVERY_KEY is required}
      # 3x-ui 面板端口（默认 1111，与 InstaCloud 平台配置一致）
      XUI_PORT: ${XUI_PORT:-1111}
    # 不写 ports:，仅通过 cloudflared 出站隧道对外提供访问

volumes:
  xui-data:
