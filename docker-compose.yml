services:
  xui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xui
    restart: unless-stopped
    volumes:
      - xui-data:/data
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      KOMARI_ENDPOINT: ${KOMARI_ENDPOINT:?KOMARI_ENDPOINT is required}
      KOMARI_TOKEN: ${KOMARI_TOKEN:?KOMARI_TOKEN is required}
      XUI_PORT: ${XUI_PORT:-2053}
    # 不写任何 ports:，完全依赖 cloudflared 出站连接，不对外暴露端口

volumes:
  xui-data:
