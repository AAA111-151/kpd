services:
  xui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xui
    restart: unless-stopped
    volumes:
      - xui-data:/data
    environment:
      XUI_DB_FOLDER: /data
      XUI_LOG_FOLDER: /dev/null
    expose:
      - "2053"
      - "2096"
      - "3333"
volumes:
  xui-data:
